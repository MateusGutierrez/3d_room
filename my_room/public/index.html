<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="description" content="Mateus Maia Gutierrez - Interactive 3D Portfolio" />
    <meta name="theme-color" content="#1a1614" />
    <link rel="icon" href="./img/M_favicon.png" />
    <title>Mateus Maia Gutierrez - Portfolio 2025</title>
    <!-- CSS da tela de boot fica aqui (e não no bundle) para ela aparecer antes do JavaScript -->
    <style>
      body {
        margin: 0;
        background: #000;
      }

      /* BIOS Boot Screen */
      .bios {
        position: fixed;
        inset: 0;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
        transition: opacity 0.8s ease-out;
      }

      .bios--started {
        opacity: 0;
        pointer-events: none;
      }

      .bios__screen {
        width: min(720px, 92vw);
        height: min(480px, 80vh);
        background: #000;
        border: 1px solid rgba(255, 255, 255, 0.06);
        display: flex;
        flex-direction: column;
        padding: 24px 32px;
        font-family: 'Courier New', 'Lucida Console', monospace;
        font-size: clamp(0.72rem, 1.4vw, 0.88rem);
        color: #ccc;
        line-height: 1.7;
        position: relative;
        overflow: hidden;
      }

      .bios__content {
        flex: 1;
        /* overflow-y: auto; */
        scrollbar-width: none;
      }

      .bios__content::-webkit-scrollbar {
        display: none;
      }

      .bios__header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 4px;
      }

      .bios__title {
        color: #fff;
        font-weight: bold;
        letter-spacing: 0.05em;
      }

      .bios__subtitle {
        color: #aaa;
        font-weight: normal;
        letter-spacing: 0;
      }

      .bios__date {
        color: #8a8a8a;
        font-size: 0.8em;
      }

      .bios__separator {
        border: none;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        margin: 8px 0 12px;
      }

      .bios__line {
        white-space: pre;
        min-height: 1.7em;
        animation: bios-line-in 0.15s ease-out;
      }

      @keyframes bios-line-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .bios__line--resource {
        color: #888;
      }

      .bios__line--loading {
        color: #e8560d;
        font-weight: bold;
      }

      .bios__line--success {
        color: #4ade80;
        font-weight: bold;
      }

      /* Animated dots: cycling through . .. ... */
      .bios__dots::after {
        content: '';
        animation: dotty 1.5s steps(3, end) infinite;
      }

      @keyframes dotty {
        0% {
          content: '';
        }
        33% {
          content: '.';
        }
        66% {
          content: '..';
        }
        100% {
          content: '...';
        }
      }

      .bios__finished {
        animation: bios-line-in 0.4s ease-out;
      }

      /* Start container */
      .bios__start-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 20px 0 12px;
        animation: bios-fade-up 0.5s ease-out;
      }

      @keyframes bios-fade-up {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .bios__start-prompt {
        color: #fff;
        font-size: 0.9em;
        letter-spacing: 0.05em;
      }

      .bios__cursor {
        display: inline-block;
        width: 8px;
        height: 1.1em;
        background: #fff;
        margin-left: 4px;
        vertical-align: text-bottom;
        animation: bios-blink 0.65s step-end infinite;
      }

      @keyframes bios-blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0;
        }
      }

      .bios__start-btn {
        padding: 10px 40px;
        background: transparent;
        color: #fff;
        border: 1px solid #fff;
        font-family: 'Courier New', 'Lucida Console', monospace;
        font-size: 1rem;
        font-weight: bold;
        letter-spacing: 0.2em;
        cursor: pointer;
        transition: all 0.2s ease-in-out;
      }

      .bios__start-btn:hover {
        background: #fff;
        color: #000;
      }

      .bios__start-btn:active {
        transform: scale(0.96);
      }

      /* Footer */
      .bios__footer {
        display: flex;
        justify-content: space-between;
        color: #777;
        font-size: 0.75em;
        white-space: nowrap;
        padding-top: 12px;
        border-top: 1px solid rgba(255, 255, 255, 0.04);
      }
    </style>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!--
      Primeiro quadro da tela de boot, igual ao que o Loader.tsx renderiza.
      Aparece antes do JavaScript carregar (o React substitui ao montar) e é o
      maior texto da tela, então vira o LCP logo de cara.
    -->
    <div id="root">
      <div class="bios">
        <div class="bios__screen">
          <div class="bios__content">
            <div class="bios__header">
              <div class="bios__title">
                Mateus, Inc. Portfolio BIOS v1.0<br />
                <span class="bios__subtitle">Copyright (C) Mateus Maia Gutierrez</span>
              </div>
              <span class="bios__date">Released: <span data-today></span></span>
            </div>
            <div class="bios__separator"></div>
          </div>
          <div class="bios__footer">
            <span>Press DEL to enter SETUP, ESC to skip memory test</span>
            <span data-today></span>
          </div>
        </div>
      </div>
    </div>
    <script>
      // Mesma data que o Loader mostra, para nada "pular" quando o React assumir
      document.querySelectorAll('[data-today]').forEach(function (el) {
        el.textContent = new Date().toLocaleDateString('en-US', {
          month: '2-digit',
          day: '2-digit',
          year: 'numeric',
        });
      });
    </script>
  </body>
</html>
